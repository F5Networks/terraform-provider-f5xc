name: Go Unit Tests

on:
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - '.github/workflows/**'
      - '.goreleaser.yml'
  workflow_dispatch:

jobs:
  tests:
    name: Go Tests
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    
    # Global environment variables for the job
    env:
      GOPRIVATE: "gopkg.volterra.us,gitlab.com/f5/*"
      GOTOOLCHAIN: "auto"
      # Prevent Git from hanging on interactive authentication prompts
      GIT_TERMINAL_PROMPT: "0"

    steps:
      # 1. Reset permissions and clean previous run state on self-hosted runner
      - name: Cleanup workspace and git config
        run: |
          sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true
          rm -f ~/.netrc
          git config --global --remove-section url."https://gitlab.com/" 2>/dev/null || true
        continue-on-error: true
      
      # 2. Ensure required system packages are installed
      - name: Install unzip
        run: |
          if command -v unzip > /dev/null; then
            echo "unzip is already installed"
          else
            sudo yum install -y unzip || sudo dnf install -y unzip || sudo apt-get install -y unzip
          fi
    
      # 3. Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 4. Set up Go environment (automatically matches version in go.mod)
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
        id: go

      # 5. Configure GitLab authentication for private Go modules via Deploy Token
      - name: Configure Git for Private Modules
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.GITLAB_DEPLOY_TOKEN_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.GITLAB_DEPLOY_TOKEN_PASSWORD }}
        run: |
          # 1. Check if the required secrets are available
          if [ -z "${DEPLOY_PASSWORD}" ]; then
            echo "::error::GITLAB_DEPLOY_TOKEN_PASSWORD secret is empty or inaccessible."
            exit 1
          fi
          
          # 2. Configure ~/.netrc using Deploy Token credentials
          echo "machine gitlab.com login ${DEPLOY_USER} password ${DEPLOY_PASSWORD}" > ~/.netrc
          chmod 600 ~/.netrc
          
          # 3. Disable credential helper to prevent caching stale credentials on self-hosted runner
          git config --global credential.helper ""
          
          echo "GitLab Deploy Token credentials successfully configured in ~/.netrc"

      # 6. Install Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5" # Adjust to your desired Terraform version
          terraform_wrapper: false

      # 7. Run make target to tidy and verify Go modules
      - name: Make Tidy (Verify)
        run: make cmd-go-mod-tidy

      # 8. Run the test suite
      - name: Run tests
        run: |
          TF_BINARY=$(which terraform)
          echo "Using Terraform from: $TF_BINARY"
          TF_ACC=1 \
          TF_ACC_TERRAFORM_PATH=$TF_BINARY \
          go test -v ./... -timeout=30m

      # 9. Cleanup sensitive credentials on self-hosted runner
      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f ~/.netrc
          echo "Successfully removed ~/.netrc"
