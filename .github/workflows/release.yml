# Binaries are built in GitLab CI and uploaded to the GitLab Generic Package Registry.
# This workflow downloads those pre-built binaries and publishes them as a GitHub Release.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.3.1 - leave empty for current ref)'
        required: false
        default: ''

jobs:
  sync-release:
    name: Sync GitLab Binaries to GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download binaries from GitLab Package Registry
        env:
          GITLAB_USER: ${{ secrets.GITLAB_DEPLOY_TOKEN_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_DEPLOY_TOKEN_PASSWORD }}
          TAG: ${{ steps.vars.outputs.tag }}
          # URL-encoded path of f5/volterra/ves.io/terraform-provider-f5xc
          GITLAB_PROJECT: "f5%2Fvolterra%2Fves.io%2Fterraform-provider-f5xc"
          PACKAGE_NAME: "terraform-provider-f5xc"
        run: |
          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "::error::GITLAB_DEPLOY_TOKEN_PASSWORD secret is missing or empty!"
            exit 1
          fi

          mkdir -p dist

          # 1. Test different possible version strings in GitLab (v0.3.1, 0.3.1, vv0.3.1)
          POSSIBLE_VERSIONS=("${TAG}" "${TAG#v}" "v${TAG}")
          FOUND_VERSION=""

          echo "Detecting package version in GitLab Registry for tag '${TAG}'..."

          for VER in "${POSSIBLE_VERSIONS[@]}"; do
            TEST_URL="https://gitlab.com/api/v4/projects/${GITLAB_PROJECT}/packages/generic/${PACKAGE_NAME}/${VER}/terraform-provider-f5xc_linux_amd64"
            echo "Testing URL: ${TEST_URL}"

            # Check HTTP status code
            HTTP_CODE=$(curl -s -o /tmp/curl_test_response.txt -w "%{http_code}" \
              --header "DEPLOY-TOKEN: ${GITLAB_TOKEN}" \
              -u "${GITLAB_USER}:${GITLAB_TOKEN}" \
              "${TEST_URL}")

            echo "HTTP Status: ${HTTP_CODE}"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              FOUND_VERSION="${VER}"
              echo "==> Successfully found package version: ${FOUND_VERSION}"
              break
            else
              echo "Response: $(cat /tmp/curl_test_response.txt)"
            fi
          done

          if [ -z "$FOUND_VERSION" ]; then
            echo "::error::Could not find binaries under any tag variation (${POSSIBLE_VERSIONS[*]}). Please check credentials and package path."
            exit 1
          fi

          BASE_URL="https://gitlab.com/api/v4/projects/${GITLAB_PROJECT}/packages/generic/${PACKAGE_NAME}/${FOUND_VERSION}"

          BINARIES=(
            "terraform-provider-f5xc_linux_amd64"
            "terraform-provider-f5xc_darwin_amd64"
            "terraform-provider-f5xc_darwin_arm64"
            "terraform-provider-f5xc_windows_amd64.exe"
          )

          for FILENAME in "${BINARIES[@]}"; do
            echo "Downloading ${FILENAME}..."
            curl --fail -sSL \
              --header "DEPLOY-TOKEN: ${GITLAB_TOKEN}" \
              -u "${GITLAB_USER}:${GITLAB_TOKEN}" \
              -o "dist/${FILENAME}" \
              "${BASE_URL}/${FILENAME}"
          done

          # 2. Generate SHA256SUMS for downloaded assets
          echo "Generating SHA256SUMS..."
          cd dist
          sha256sum terraform-provider-f5xc_* > SHA256SUMS 2>/dev/null || true
          cd ..

          echo "Downloaded assets ready for release:"
          ls -lh dist/

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
