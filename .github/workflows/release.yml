# Binaries and SBOMs are built in GitLab CI and uploaded to the GitLab Generic Package Registry.
# This workflow downloads those pre-built binaries and SBOMs, packages them into Terraform Registry
# compliant ZIP archives, includes the registry manifest, signs checksums with GPG, and publishes
# them as a GitHub Release.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.3.1 - leave empty for current ref)'
        required: false
        default: ''

jobs:
  sync-release:
    name: Sync GitLab Binaries to GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (for terraform-registry-manifest.json)
        uses: actions/checkout@v4

      - name: Determine Release Tag & Version
        id: vars
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # Remove leading 'v' for artifact filenames (e.g. v0.3.1 -> 0.3.1)
          VERSION="${TAG#v}"
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download binaries, SBOMs, and release notes from GitLab Package Registry
        env:
          GITLAB_DEPLOY_TOKEN: ${{ secrets.GITLAB_DEPLOY_TOKEN_PASSWORD }}
          TAG: ${{ steps.vars.outputs.tag }}
          GITLAB_PROJECT_ID: "50750365"
          PACKAGE_NAME: "terraform-provider-f5xc"
        run: |
          if [ -z "${GITLAB_DEPLOY_TOKEN}" ]; then
            echo "::error::GITLAB_DEPLOY_TOKEN_PASSWORD secret is missing or empty!"
            exit 1
          fi

          mkdir -p raw_binaries
          BASE_URL="https://gitlab.com/api/v4/projects/${GITLAB_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${TAG}"

          echo "Downloading pre-built binaries and SBOMs for tag: ${TAG}..."

          BINARIES=(
            "terraform-provider-f5xc_linux_amd64"
            "terraform-provider-f5xc_darwin_amd64"
            "terraform-provider-f5xc_darwin_arm64"
            "terraform-provider-f5xc_windows_amd64.exe"
          )

          for FILENAME in "${BINARIES[@]}"; do
            echo "Fetching ${FILENAME}..."
            curl --fail -sSL \
              --header "DEPLOY-TOKEN: ${GITLAB_DEPLOY_TOKEN}" \
              -o "raw_binaries/${FILENAME}" \
              "${BASE_URL}/${FILENAME}"

            echo "Fetching ${FILENAME}.sbom.json..."
            curl --fail -sSL \
              --header "DEPLOY-TOKEN: ${GITLAB_DEPLOY_TOKEN}" \
              -o "raw_binaries/${FILENAME}.sbom.json" \
              "${BASE_URL}/${FILENAME}.sbom.json"
          done

          echo "Fetching RELEASE_NOTES.md..."
          curl --fail -sSL \
            --header "DEPLOY-TOKEN: ${GITLAB_DEPLOY_TOKEN}" \
            -o RELEASE_NOTES.md \
            "${BASE_URL}/RELEASE_NOTES.md"
          test -s RELEASE_NOTES.md

      - name: Package Binaries, SBOMs, and Registry Manifest
        run: |
          mkdir -p dist
          VERSION="${{ steps.vars.outputs.version }}"

          # Platform mappings: Input filename -> OS_ARCH
          declare -A PLATFORMS=(
            ["terraform-provider-f5xc_linux_amd64"]="linux_amd64"
            ["terraform-provider-f5xc_darwin_amd64"]="darwin_amd64"
            ["terraform-provider-f5xc_darwin_arm64"]="darwin_arm64"
            ["terraform-provider-f5xc_windows_amd64.exe"]="windows_amd64"
          )

          for SRC_FILE in "${!PLATFORMS[@]}"; do
            OS_ARCH="${PLATFORMS[$SRC_FILE]}"
            ZIP_NAME="terraform-provider-f5xc_${VERSION}_${OS_ARCH}.zip"
            SBOM_NAME="${ZIP_NAME}.sbom.json"

            mkdir -p tmp_pack
            if [[ "$OS_ARCH" == windows* ]]; then
              INTERNAL_BIN="terraform-provider-f5xc_v${VERSION}.exe"
            else
              INTERNAL_BIN="terraform-provider-f5xc_v${VERSION}"
            fi

            cp "raw_binaries/${SRC_FILE}" "tmp_pack/${INTERNAL_BIN}"
            chmod +x "tmp_pack/${INTERNAL_BIN}"

            # Terraform Registry requires ZIP format
            (cd tmp_pack && zip -q "../dist/${ZIP_NAME}" "${INTERNAL_BIN}")
            rm -rf tmp_pack

            # Copy corresponding SPDX-JSON SBOM into dist/
            cp "raw_binaries/${SRC_FILE}.sbom.json" "dist/${SBOM_NAME}"

            echo "Created dist/${ZIP_NAME} and dist/${SBOM_NAME}"
          done

          # Include Terraform Registry Manifest (required for Protocol v6.0 advertisement)
          MANIFEST_NAME="terraform-provider-f5xc_${VERSION}_manifest.json"
          cp terraform-registry-manifest.json "dist/${MANIFEST_NAME}"
          echo "Created dist/${MANIFEST_NAME}"

      - name: Generate Checksums
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          CHECKSUM_FILE="terraform-provider-f5xc_${VERSION}_SHA256SUMS"

          cd dist
          sha256sum *.zip *_manifest.json *.sbom.json > "${CHECKSUM_FILE}"
          echo "Generated ${CHECKSUM_FILE}:"
          cat "${CHECKSUM_FILE}"
          cd ..

      - name: Import GPG Key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign Checksums with GPG
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          CHECKSUM_FILE="terraform-provider-f5xc_${VERSION}_SHA256SUMS"
          SIG_FILE="terraform-provider-f5xc_${VERSION}_SHA256SUMS.sig"

          cd dist
          gpg --batch --no-tty --detach-sign \
            --local-user "${{ steps.import_gpg.outputs.fingerprint }}" \
            --output "${SIG_FILE}" \
            "${CHECKSUM_FILE}"

          echo "Successfully generated signature ${SIG_FILE}"
          cd ..

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}