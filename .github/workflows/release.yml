# Binaries are built in GitLab CI and uploaded to the GitLab Generic Package Registry.
# This workflow downloads those pre-built binaries and publishes them as a GitHub Release.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.3.1 - leave empty for current ref)'
        required: false
        default: ''

jobs:
  sync-release:
    name: Sync GitLab Binaries to GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download binaries from GitLab Package Registry
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_DEPLOY_TOKEN_PASSWORD }}
          TAG: ${{ steps.vars.outputs.tag }}
          # URL-encoded path of f5/volterra/ves.io/terraform-provider-f5xc
          GITLAB_PROJECT: "f5%2Fvolterra%2Fves.io%2Fterraform-provider-f5xc"
          PACKAGE_NAME: "terraform-provider-f5xc"
        run: |
          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "::error::GITLAB_DEPLOY_TOKEN_PASSWORD secret is missing or empty!"
            exit 1
          fi

          mkdir -p dist

          echo "Searching GitLab Package Registry for tag: ${TAG}..."

          # 1. Fetch package ID for this tag/version from GitLab API
          PACKAGE_ID=$(curl -sSL --header "DEPLOY-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/projects/${GITLAB_PROJECT}/packages?package_name=${PACKAGE_NAME}" \
            | jq -r --arg TAG "${TAG}" --arg TAG_NO_V "${TAG#v}" \
              '.[] | select(.version == $TAG or .version == $TAG_NO_V or .version == ("v" + $TAG) or .version == ("vv" + $TAG)) | .id' | head -n 1)

          if [ -z "$PACKAGE_ID" ] || [ "$PACKAGE_ID" = "null" ]; then
            echo "::error::Could not find package ID for tag ${TAG} in GitLab Package Registry!"
            exit 1
          fi

          echo "Found GitLab Package ID: ${PACKAGE_ID}"

          # 2. Get list of all package files for this package
          FILES_JSON=$(curl -sSL --header "DEPLOY-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/projects/${GITLAB_PROJECT}/packages/${PACKAGE_ID}/package_files")

          # 3. Target binary filenames
          BINARIES=(
            "terraform-provider-f5xc_linux_amd64"
            "terraform-provider-f5xc_darwin_amd64"
            "terraform-provider-f5xc_darwin_arm64"
            "terraform-provider-f5xc_windows_amd64.exe"
          )

          for FILENAME in "${BINARIES[@]}"; do
            echo "Locating latest file ID for ${FILENAME}..."
            # Pick the most recently created file ID for this filename
            FILE_ID=$(echo "${FILES_JSON}" | jq -r --arg FN "${FILENAME}" \
              '[.[] | select(.file_name == $FN)] | sort_by(.created_at) | last | .id')

            if [ -n "$FILE_ID" ] && [ "$FILE_ID" != "null" ]; then
              echo "Downloading ${FILENAME} (File ID: ${FILE_ID})..."
              curl --fail -sSL \
                --header "DEPLOY-TOKEN: ${GITLAB_TOKEN}" \
                -o "dist/${FILENAME}" \
                "https://gitlab.com/api/v4/projects/${GITLAB_PROJECT}/packages/generic/${PACKAGE_NAME}/${TAG}/${FILENAME}" \
                || curl --fail -sSL \
                --header "DEPLOY-TOKEN: ${GITLAB_TOKEN}" \
                -o "dist/${FILENAME}" \
                "https://gitlab.com/f5/volterra/ves.io/terraform-provider-f5xc/-/package_files/${FILE_ID}/download"
            else
              echo "::warning::File ${FILENAME} not found in package ${PACKAGE_ID}"
            fi
          done

          # 4. Generate SHA256SUMS for the downloaded binaries
          echo "Generating SHA256SUMS for downloaded binaries..."
          cd dist
          sha256sum terraform-provider-f5xc_* > SHA256SUMS 2>/dev/null || true
          cd ..

          echo "Listing downloaded assets in dist/:"
          ls -lh dist/

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
