# Binaries are built in GitLab CI and uploaded to the GitLab Generic Package Registry.
# This workflow downloads those pre-built binaries and publishes them as a GitHub Release.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: self-hosted
    # Ensure variables like GOPRIVATE are available for the build
    env:
      GOPRIVATE: "gopkg.volterra.us,gitlab.com/f5/*"
      GOTOOLCHAIN: auto
      GIT_TERMINAL_PROMPT: "0"
  sync-release:
    name: Sync GitLab Binaries to GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries from GitLab Package Registry
        env:
          GITLAB_USER: ${{ secrets.GITLAB_DEPLOY_TOKEN_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_DEPLOY_TOKEN_PASSWORD }}
          TAG: ${{ github.ref_name }}
          # URL-encoded path of f5/volterra/ves.io/terraform-provider-f5xc
          GITLAB_PROJECT: "f5%2Fvolterra%2Fves.io%2Fterraform-provider-f5xc"
          PACKAGE_NAME: "terraform-provider-f5xc"
        run: |
          mkdir -p dist
          BASE_URL="https://gitlab.com/api/v4/projects/${GITLAB_PROJECT}/packages/generic/${PACKAGE_NAME}/${TAG}"

          BINARIES=(
            "terraform-provider-f5xc_linux_amd64"
            "terraform-provider-f5xc_darwin_amd64"
            "terraform-provider-f5xc_darwin_arm64"
            "terraform-provider-f5xc_windows_amd64.exe"
          )

          for FILENAME in "${BINARIES[@]}"; do
            echo "Downloading ${FILENAME}..."
            curl --fail -sSL \
              -u "${GITLAB_USER}:${GITLAB_TOKEN}" \
              -o "dist/${FILENAME}" \
              "${BASE_URL}/${FILENAME}"
          done

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
